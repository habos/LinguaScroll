# Local dev: Postgres 16 only (no Redis in v0).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linguascroll
    ports:
      # 54320, not 5432, so a Postgres already installed on the Mac
      # (Homebrew, Postgres.app) can keep 5432.
      - "127.0.0.1:54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
