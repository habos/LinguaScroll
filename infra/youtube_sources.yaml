# YouTube search terms and seed channels per language (module V3).
# `make sources` loads this into youtube_sources; rows missing from the file
# are disabled, not deleted. level is an optional 1-6 hint for every clip
# the source finds. Seed channels are trusted for language, so only list a
# channel whose Shorts are all in that language.
#
# Search costs 100 quota units; prefer a few good queries and seed channels
# over many broad queries. Adding a language: add a block here, a row in
# backend/seed/01_languages.sql and level words in app_config
# youtube.level_keywords.
es:
  queries:
    - text: aprender español shorts
    - text: español para principiantes
      level: 1
    - text: historias cortas en español
    - text: español nativo conversación
      level: 5
  channels: []
