# XcodeGen spec for the LinguaScroll iOS app (v0).
#   brew install xcodegen
#   cd ios/App && xcodegen && open LinguaScroll.xcodeproj
# First build: Xcode asks to trust the OpenAPIGenerator plugin (Trust & Enable).
name: LinguaScroll
options:
  bundleIdPrefix: app.linguascroll
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  APIClient:
    path: ../Packages/APIClient
  Core:
    path: ../Packages/Core
  Features:
    path: ../Packages/Features
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  LinguaScroll:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: APIClient
      - package: Core
      - package: Features
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LinguaScroll
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Server the app talks to. Simulator: localhost. Real phone: your Mac's
        # LAN address, e.g. http://192.168.1.20:8080 (set API_BASE_URL below).
        APIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        # Free provisioning needs a bundle ID nobody else has registered;
        # change it if Xcode complains (e.g. com.<yourname>.linguascroll).
        PRODUCT_BUNDLE_IDENTIFIER: app.linguascroll.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        API_BASE_URL: "http:/$()/localhost:8080"
