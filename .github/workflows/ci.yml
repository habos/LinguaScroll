name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated code is up to date
        run: make gen-check
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Migrate and seed a fresh database
        run: make migrate seed

  ios-client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the generated Swift client
        working-directory: ios/Packages/APIClient
        run: swift build

  ios-spike:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the spike project
        working-directory: ios/Spike
        run: brew install xcodegen && xcodegen
      - name: Build the spike for the simulator
        working-directory: ios/Spike
        shell: bash # -eo pipefail, so a failed build fails the step
        run: >-
          xcodebuild build -project LinguaScrollSpike.xcodeproj -scheme LinguaScrollSpike
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO 2>&1
          | grep -E '(error|warning):|\*\* BUILD'

  ios-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core unit tests (install ID, 401 recovery, event retry)
        working-directory: ios/Packages/Core
        run: swift test

  ios-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the app project
        working-directory: ios/App
        run: brew install xcodegen && xcodegen
      - name: Build and test the app on the smallest iPhone (QA rows V6-05, V6-08, V6-09, V6-10)
        working-directory: ios/App
        shell: bash # -eo pipefail, so a failed build or test fails the step
        run: >-
          xcodebuild test -project LinguaScroll.xcodeproj -scheme LinguaScroll
          -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation)' -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO 2>&1
          | grep -E '(error|warning):|\*\* (BUILD|TEST)|Test Case|Executed'
