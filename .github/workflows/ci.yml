name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated code is up to date
        run: make gen-check
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Migrate and seed a fresh database
        run: make migrate seed
      - name: YouTube compliance queries return no rows
        run: |
          out=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -f qa/sql/compliance.sql)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

  ios-client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the generated Swift client
        working-directory: ios/Packages/APIClient
        run: swift build
